<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211a52">
<meta name="description" content="Browse all TM Market products.">
<title>Shop All Products | TM Market</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="script.js"></script>
</head>
<body data-page="app" data-protected>

    <div id="siteHeader"></div>

    <main class="products-container">
        <aside class="filters-sidebar">
            <h3>Filter Products</h3>
            <div class="filter-group">
                <h4>Category</h4>
                <div id="catFilters"></div>
            </div>
            <div class="filter-group">
                <h4>Price</h4>
                <input type="range" id="priceRange" min="1000" max="500000" aria-label="Maximum price">
                <span class="price-readout" id="priceReadout"></span>
            </div>
        </aside>

        <section class="products-list">
            <div class="products-header">
                <h2>All Items</h2>
                <select id="shopSort" aria-label="Sort products">
                    <option value="featured">Sort by: Featured</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>
            <div class="product-grid" id="shopGrid"></div>
        </section>
    </main>

</body>
</html>
