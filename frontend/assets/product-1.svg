<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Aurora X1 smartphone">
<defs>
	<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
		<stop offset="0" stop-color="#f8fafc"/>
		<stop offset="1" stop-color="#eef2ff"/>
	</linearGradient>
	<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
		<stop stop-color="#2563eb" stop-opacity=".12"/>
		<stop offset="1" stop-color="#0ea5e9" stop-opacity=".08"/>
	</linearGradient>
	<linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
		<stop stop-color="#0f172a"/>
		<stop offset="1" stop-color="#1f2937"/>
	</linearGradient>
	<linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
		<stop stop-color="#0f172a"/>
		<stop offset=".5" stop-color="#1d4ed8"/>
		<stop offset="1" stop-color="#64748b"/>
	</linearGradient>
	<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
		<stop stop-color="#fff" stop-opacity=".85"/>
		<stop offset="1" stop-color="#fff" stop-opacity="0"/>
	</linearGradient>
	<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
		<feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#1e1b4b" flood-opacity=".20"/>
	</filter>
</defs>
