<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Seller | TM Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="homepage.html"><strong>TM MARKET</strong></a>
        </div>
        <nav>
            <a href="homepage.html">Home</a>
            <a href="product.html">Shop All</a>
        </nav>
    </header>

    <main class="vendor-page">
        <section class="vendor-hero">
            <h1>Start Selling on TM Market for Free</h1>
            <p>Reach thousands of buyers across Nigeria. Zero upfront fees.</p>
        </section>

        <section class="vendor-form-section">
            <form class="vendor-form">
                <h2>Register Your Business</h2>
                
                <label>Full Name</label>
                <input type="text" placeholder="e.g. John Doe" required>

                <label>Business / Store Name</label>
                <input type="text" placeholder="e.g. Jay Fashion Store" required>

                <label>WhatsApp Number (for order alerts)</label>
                <input type="tel" placeholder="+234..." required>

                <label>City / Location</label>
                <input type="text" placeholder="e.g. Lagos, Ikeja" required>

                <label>What do you sell?</label>
                <select required>
                    <option value="">Select Category</option>
                    <option value="electronics">Electronics & Gadgets</option>
                    <option value="fashion">Fashion & Apparel</option>
                    <option value="beauty">Beauty & Personal Care</option>
                    <option value="other">Other</option>
                </select>

                <button type="submit" class="btn-primary">Submit Application</button>
            </form>
        </section>
    </main>

</body>
</html>
