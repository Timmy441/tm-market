<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211a52">
<meta name="description" content="Can't find a product on TM Market? Request it and we will try to make it available.">
<title>Request a Product | TM Market</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
.rq-page{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.rq-hero h1{margin:0 0 6px;color:var(--ink);font-size:clamp(26px,5vw,38px)}.rq-hero p{margin:0 0 22px;color:var(--muted)}
.rq-card{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.rq-card label{display:block;margin:14px 0 5px;font-weight:700;color:var(--ink)}
.rq-card input[type=text],.rq-card input[type=number],.rq-card select,.rq-card textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--cream);color:var(--ink);font:inherit}
.rq-row{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media(max-width:620px){.rq-row{grid-template-columns:1fr}}
.rq-thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.rq-thumb{position:relative}.rq-thumb img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.rq-thumb button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border:0;border-radius:50%;background:#b3261e;color:#fff;font-weight:800;cursor:pointer}
.rq-note{margin:8px 0 0;font-size:13px;color:var(--muted)}
.rq-msg{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#e3f6ee;color:#0b6b43;font-weight:700}.rq-msg.err{background:#fdecea;color:#b3261e}
.rq-h2{margin:34px 0 14px;color:var(--ink);font-size:22px}
.rq-list{display:grid;gap:12px}
.rq-item{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.rq-item>img,.rq-noimg{width:84px;height:84px;flex:none;object-fit:cover;border-radius:12px;background:var(--cream)}
.rq-body{min-width:0;flex:1}.rq-body strong{display:block;color:var(--ink)}.rq-body p{margin:4px 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.rq-pill{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:800;text-transform:uppercase;background:#fff4dc;color:#a06a00}
.rq-pill.approved{background:#e8e3ff;color:#4b2fb0}.rq-pill.fulfilled{background:#e3f6ee;color:#0b6b43}.rq-pill.rejected{background:#fdecea;color:#b3261e}
.rq-center{text-align:center;color:var(--muted);padding:22px 0}
</style>
<script src="script.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6250392225001830"
     crossorigin="anonymous"></script>
</head>
<body data-page="app">

<div id="siteHeader"></div>

<main class="rq-page">
  <section class="rq-hero">
    <h1>Can't find it? Request it.</h1>
    <p>Tell us what you want and add at least one photo. If TM Market approves your request, it is shown below and we will try to make the product available within a few days.</p>
  </section>

  <div id="rqFormHost"></div>

  <div id="rqMineWrap" hidden>
    <h2 class="rq-h2">Your requests</h2>
    <div id="rqMine" class="rq-list"></div>
  </div>

  <h2 class="rq-h2">Requested by shoppers</h2>
  <div id="rqPublic" class="rq-list"><p class="rq-center">Loading…</p></div>
  <div class="rq-center"><button type="button" class="btn btn-ghost" id="rqMore" hidden>Load more</button></div>
</main>

<script>
(function () {
  const MAX_PHOTOS = 4;
  const host = $('#rqFormHost');
  const fmtDate = d => new Date(d).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });
  const LABEL = { pending: 'Pending review', approved: 'Published, we are sourcing it', rejected: 'Not approved', fulfilled: 'Now available' };
  const PUBLIC_LABEL = { approved: 'Being sourced', fulfilled: 'Now available' };
  let photos = [];          // File objects chosen by the customer
  let page = 1, publicTotal = 0, publicShown = 0;

  function card(r, { mine }) {
    const img = (r.images && r.images[0]) ? `<img src="${esc(r.images[0])}" alt="" loading="lazy">` : '<div class="rq-noimg"></div>';
    const meta = [r.category_name, r.budget ? 'Budget ' + money(r.budget) : '', r.location, fmtDate(r.created_at)].filter(Boolean).map(esc).join(' · ');
    const label = mine ? LABEL[r.status] : PUBLIC_LABEL[r.status];
    const note = mine && r.status === 'rejected' && r.admin_note ? `<p><strong>Reason:</strong> ${esc(r.admin_note)}</p>` : '';
    return `<article class="rq-item">${img}<div class="rq-body"><strong>${esc(r.title)}</strong><p>${esc(r.description)}</p><p>${meta}</p>${note}<span class="rq-pill ${esc(r.status)}">${esc(label || r.status)}</span></div></article>`;
  }

  async function loadMine() {
    if (!Auth.isLoggedIn()) { $('#rqMineWrap').hidden = true; return; }
    try {
      const { requests } = await apiRequest('GET', '/api/requests/mine');
      $('#rqMineWrap').hidden = !requests.length;
      $('#rqMine').innerHTML = requests.map(r => card(r, { mine: true })).join('');
    } catch (err) { $('#rqMineWrap').hidden = false; $('#rqMine').innerHTML = `<p class="rq-center">${esc(err.message)}</p>`; }
  }

  async function loadPublic(reset) {
    if (reset) { page = 1; publicShown = 0; $('#rqPublic').innerHTML = '<p class="rq-center">Loading…</p>'; } else page++;
    try {
      const { requests, pagination } = await apiRequest('GET', `/api/requests?limit=12&page=${page}`);
      publicTotal = pagination.total;
      publicShown += requests.length;
      const html = requests.map(r => card(r, { mine: false })).join('');
      if (reset) $('#rqPublic').innerHTML = html || '<p class="rq-center">No requests have been published yet. Be the first to ask for something.</p>';
      else $('#rqPublic').insertAdjacentHTML('beforeend', html);
      $('#rqMore').hidden = publicShown >= publicTotal;
    } catch (err) { if (reset) $('#rqPublic').innerHTML = `<p class="rq-center">${esc(err.message)}</p>`; else page--; }
  }

  function renderThumbs() {
    $('#rqThumbs').innerHTML = '';
    photos.forEach((f, i) => {
      const w = document.createElement('div'); w.className = 'rq-thumb';
      const im = document.createElement('img'); im.alt = ''; im.src = URL.createObjectURL(f);
      const b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Remove photo');
      b.onclick = () => { photos.splice(i, 1); renderThumbs(); };
      w.append(im, b); $('#rqThumbs').appendChild(w);
    });
  }

  async function renderForm() {
    if (!Auth.isLoggedIn()) {
      host.innerHTML = `<div class="rq-card"><strong>Log in to send a request</strong><p class="rq-note">You can browse requests from other shoppers below without an account.</p>
        <p><button type="button" class="btn btn-primary" id="rqLogin">Log in or sign up</button></p></div>`;
      $('#rqLogin').onclick = () => requireAuth(() => { renderForm(); loadMine(); }, { notice: 'Please log in or sign up to request a product.' });
      return;
    }
    host.innerHTML = `<form class="rq-card" id="rqForm" novalidate>
      <label for="rq-title">What do you want?</label>
      <input id="rq-title" type="text" maxlength="120" placeholder="e.g. Blue Samsung Galaxy S24 case" required>
      <label for="rq-desc">Describe it (size, colour, brand, anything that helps)</label>
      <textarea id="rq-desc" rows="4" maxlength="1000" required></textarea>
      <div class="rq-row">
        <div><label for="rq-cat">Category (optional)</label><select id="rq-cat"><option value="">Choose a category</option></select></div>
        <div><label for="rq-budget">Your budget in ₦ (optional)</label><input id="rq-budget" type="number" min="1" step="any" inputmode="decimal"></div>
      </div>
      <label for="rq-loc">Your city (optional)</label><input id="rq-loc" type="text" maxlength="150" placeholder="e.g. Minna">
      <label for="rq-photos">Photos (1 to ${MAX_PHOTOS}, JPG/PNG/WebP, max 5 MB each)</label>
      <input id="rq-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <div class="rq-thumbs" id="rqThumbs"></div>
      <p class="rq-note">Your request is sent to TM Market for review. It stays <strong>pending</strong> until it is approved, and only then is it shown publicly. Your name and contact details are never shown.</p>
      <p id="rqMsg" role="alert" hidden></p>
      <p><button type="submit" class="btn btn-primary" id="rqSend">Send request</button></p>
    </form>`;

    apiRequest('GET', '/api/categories').then(({ categories }) => {
      $('#rq-cat').insertAdjacentHTML('beforeend', categories.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join(''));
    }).catch(() => { /* the category is optional */ });

    $('#rq-photos').onchange = e => {
      for (const f of e.target.files) {
        if (photos.length >= MAX_PHOTOS) { toast(`You can add up to ${MAX_PHOTOS} photos.`); break; }
        if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { toast('Photos must be JPG, PNG or WebP.'); continue; }
        if (f.size > 5 * 1024 * 1024) { toast('Each photo must be under 5 MB.'); continue; }
        photos.push(f);
      }
      e.target.value = ''; renderThumbs();
    };

    $('#rqForm').onsubmit = async e => {
      e.preventDefault();
      const msg = $('#rqMsg'); const say = (t, err) => { msg.textContent = t; msg.className = 'rq-msg' + (err ? ' err' : ''); msg.hidden = !t; };
      say('');
      const title = $('#rq-title').value.trim(), description = $('#rq-desc').value.trim();
      if (title.length < 3) return say('Please say what you want.', true);
      if (description.length < 10) return say('Please describe it in a few more words.', true);
      if (!photos.length) return say('Please add at least one photo of the product.', true);
      const btn = $('#rqSend'); btn.disabled = true;
      try {
        await Loader.run(async () => {
          const urls = await Promise.all(photos.map(f => uploadImage(f, '/api/requests/uploads/sign')));
          await apiRequest('POST', '/api/requests', {
            title, description, images: urls,
            categoryId: $('#rq-cat').value || undefined, budget: $('#rq-budget').value || undefined, location: $('#rq-loc').value.trim() || undefined
          });
        }, { text: 'Sending your request…' });
        photos = []; $('#rqForm').reset(); renderThumbs();
        say('Request sent! It is pending review by TM Market. You can follow its status under "Your requests".');
        loadMine();
      } catch (err) { say(err.message, true); }
      finally { btn.disabled = false; }
    };
  }

  $('#rqMore').onclick = () => loadPublic(false);
  renderForm(); loadMine(); loadPublic(true);
})();
</script>
</body>
</html>
